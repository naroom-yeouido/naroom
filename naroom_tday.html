<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5월 스승의 날 주문 상담</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fdf6f0;
    font-family: 'Noto Sans KR', sans-serif;
    color: #3a2a20;
    min-height: 100vh;
  }

  .page-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 60px;
  }

  .hero-img {
    width: 100%;
    display: block;
    border-bottom: 3px solid #e8c9b0;
  }

  .header {
    background: #fff9f4;
    border-bottom: 1.5px solid #e8c9b0;
    padding: 28px 28px 22px;
    text-align: center;
  }

  .header-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #c0836a;
    font-weight: 500;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .header h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 24px;
    font-weight: 800;
    color: #3a2a20;
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .header-desc {
    font-size: 13px;
    color: #8a6a58;
    line-height: 1.8;
  }

  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #fdeee6;
    border: 1px solid #e8c9b0;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: #c0836a;
    margin-top: 10px;
  }

  .section {
    background: #fff;
    margin: 16px 20px 0;
    border-radius: 16px;
    border: 1.5px solid #edd9c8;
    overflow: hidden;
  }

  .section-title {
    background: #fdf0e8;
    border-bottom: 1.5px solid #edd9c8;
    padding: 12px 20px;
    font-family: 'Nanum Myeongjo', serif;
    font-size: 15px;
    font-weight: 700;
    color: #7a4030;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c0836a;
    flex-shrink: 0;
  }

  .product-item {
    padding: 16px 20px;
    border-bottom: 1px solid #f5ece4;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .product-item:last-child { border-bottom: none; }

  .product-check-wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 160px;
    gap: 6px;
  }

  .checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    position: relative;
  }

  .checkbox-label input[type="checkbox"] {
    display: none;
  }

  .custom-check {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 1.5px solid #d4a88a;
    background: #fff;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .checkbox-label input:checked ~ .custom-check {
    background: #c0836a;
    border-color: #c0836a;
  }

  .custom-check::after {
    content: '';
    width: 5px; height: 9px;
    border: 2px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translateY(-1px);
    display: none;
  }

  .checkbox-label input:checked ~ .custom-check::after { display: block; }

  .product-name {
    font-size: 14px;
    font-weight: 500;
    color: #3a2a20;
    line-height: 1.5;
  }

  .product-price {
    font-size: 13px;
    color: #c0836a;
    font-weight: 600;
    margin-top: 1px;
  }

  .qty-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fdf6f0;
    border: 1.5px solid #e8c9b0;
    border-radius: 24px;
    padding: 4px 6px;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .qty-wrap.active {
    opacity: 1;
    pointer-events: all;
  }

  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: #c0836a;
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 300;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .qty-btn:hover { background: #a06050; }
  .qty-btn:active { transform: scale(0.92); }

  .qty-num {
    min-width: 24px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #3a2a20;
  }

  .sub-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 14px;
    border-bottom: 1px solid #f5ece4;
  }

  .sub-opt-label {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    background: #fdf0e8;
    border: 1.5px solid #e8c9b0;
    border-radius: 20px;
    padding: 6px 14px;
    transition: all 0.2s;
    font-size: 13px;
    color: #7a4030;
    font-weight: 500;
  }

  .sub-opt-label input { display: none; }
  .sub-opt-label.selected {
    background: #c0836a;
    border-color: #c0836a;
    color: #fff;
  }

  .sub-qty-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fdf6f0;
    border: 1.5px solid #e8c9b0;
    border-radius: 24px;
    padding: 4px 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    margin-left: 4px;
  }

  .sub-qty-wrap.active {
    opacity: 1;
    pointer-events: all;
  }

  .form-row {
    padding: 14px 20px;
    border-bottom: 1px solid #f5ece4;
  }

  .form-row:last-child { border-bottom: none; }

  .form-label {
    font-size: 12px;
    color: #8a6a58;
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .form-input {
    width: 100%;
    border: 1.5px solid #e8c9b0;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: #3a2a20;
    background: #fff9f4;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: #c0836a; background: #fff; }

  .date-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .date-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    background: #fdf0e8;
    border: 1.5px solid #e8c9b0;
    border-radius: 10px;
    padding: 10px 14px;
    transition: all 0.2s;
  }

  .date-opt input { display: none; }

  .date-opt span {
    font-size: 14px;
    color: #7a4030;
    font-weight: 500;
  }

  .date-opt.selected {
    background: #c0836a;
    border-color: #c0836a;
  }

  .date-opt.selected span { color: #fff; }

  .time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .time-opt {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: #fdf0e8;
    border: 1.5px solid #e8c9b0;
    border-radius: 8px;
    padding: 8px 4px;
    transition: all 0.2s;
    font-size: 13px;
    font-weight: 500;
    color: #7a4030;
    text-align: center;
  }

  .time-opt input { display: none; }

  .time-opt.selected {
    background: #c0836a;
    border-color: #c0836a;
    color: #fff;
  }

  .total-box {
    margin: 16px 20px 0;
    background: #3a2a20;
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .total-label {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 15px;
    color: #e8c9b0;
  }

  .total-amount {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 26px;
    font-weight: 800;
    color: #fdeee6;
  }

  .total-amount span {
    font-size: 16px;
    font-weight: 400;
    color: #c0836a;
  }

  .kakao-btn {
    display: block;
    margin: 14px 20px 0;
    background: #FEE500;
    border: none;
    border-radius: 14px;
    padding: 17px 20px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #3A1D1D;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: filter 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .kakao-btn:hover { filter: brightness(0.95); }
  .kakao-btn:active { transform: scale(0.98); }

  .kakao-icon {
    width: 24px; height: 24px;
  }

  .notice {
    margin: 12px 20px 0;
    font-size: 12px;
    color: #a08070;
    line-height: 1.7;
    text-align: center;
    padding: 12px;
    background: #fff9f4;
    border-radius: 10px;
    border: 1px solid #edd9c8;
  }

  .sub-options-container {
    display: none;
  }

  .sub-options-container.show {
    display: flex;
  }
</style>
</head>
<body>
<div class="page-wrap">

  <img class="hero-img" src="https://github.com/naroom-yeouido/naroom/blob/main/5.jpg?raw=true" alt="5월 스승의 날 디저트">

  <div class="header">
    <div class="header-label">나룸 여의도</div>
    <h1>5월 스승의 날<br>주문 상담</h1>
    <div class="header-desc">
      보신 디저트 기준으로 필요한 항목만 선택 해 주세요!
    </div>
    <div class="timer-badge">
      ⏰ 보통 1~3분 정도 소요됩니다
    </div>
  </div>

  <!-- 메뉴 선택 -->
  <div class="section">
    <div class="section-title"><span class="dot"></span>메뉴 선택</div>

    <!-- 카네이션설기 -->
    <div class="product-item" id="item-carnation" style="flex-direction:column; align-items:flex-start;">
      <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
        <div class="product-check-wrap">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-carnation" onchange="toggleSubOpts('carnation', this.checked)">
            <span class="custom-check"></span>
            <div>
              <div class="product-name">🌸 카네이션설기</div>
              <div class="product-price">4구 23,000원 / 6구 33,000원</div>
            </div>
          </label>
        </div>
      </div>
      <div class="sub-options-container" id="sub-carnation">
        <div style="width:100%; padding: 0 0 4px;">
          <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
            <label class="sub-opt-label" id="sub-carn-4" onclick="toggleSubOpt('carn', '4구', 23000, this)">
              <input type="checkbox"> 4구 23,000원
            </label>
            <div class="sub-qty-wrap" id="qty-carn-4">
              <button class="qty-btn" onclick="changeQty('carn-4',-1)">−</button>
              <span class="qty-num" id="num-carn-4">1</span>
              <button class="qty-btn" onclick="changeQty('carn-4',1)">+</button>
            </div>

            <label class="sub-opt-label" id="sub-carn-6" onclick="toggleSubOpt('carn', '6구', 33000, this)">
              <input type="checkbox"> 6구 33,000원
            </label>
            <div class="sub-qty-wrap" id="qty-carn-6">
              <button class="qty-btn" onclick="changeQty('carn-6',-1)">−</button>
              <span class="qty-num" id="num-carn-6">1</span>
              <button class="qty-btn" onclick="changeQty('carn-6',1)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 복숭아모나카 -->
    <div class="product-item">
      <div class="product-check-wrap">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-monaka" onchange="toggleSimple('monaka', this.checked)">
          <span class="custom-check"></span>
          <div>
            <div class="product-name">🍑 복숭아모나카 set</div>
            <div class="product-price">33,000원</div>
          </div>
        </label>
      </div>
      <div class="qty-wrap" id="qty-monaka">
        <button class="qty-btn" onclick="changeQty('monaka',-1)">−</button>
        <span class="qty-num" id="num-monaka">1</span>
        <button class="qty-btn" onclick="changeQty('monaka',1)">+</button>
      </div>
    </div>

    <!-- 화과자 -->
    <div class="product-item">
      <div class="product-check-wrap">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-wagashi" onchange="toggleSimple('wagashi', this.checked)">
          <span class="custom-check"></span>
          <div>
            <div class="product-name">🌿 화과자 set</div>
            <div class="product-price">36,500원</div>
          </div>
        </label>
      </div>
      <div class="qty-wrap" id="qty-wagashi">
        <button class="qty-btn" onclick="changeQty('wagashi',-1)">−</button>
        <span class="qty-num" id="num-wagashi">1</span>
        <button class="qty-btn" onclick="changeQty('wagashi',1)">+</button>
      </div>
    </div>

    <!-- 도라지정과 -->
    <div class="product-item">
      <div class="product-check-wrap">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-doraji" onchange="toggleSimple('doraji', this.checked)">
          <span class="custom-check"></span>
          <div>
            <div class="product-name">🫚 도라지정과 set</div>
            <div class="product-price">95,000원</div>
          </div>
        </label>
      </div>
      <div class="qty-wrap" id="qty-doraji">
        <button class="qty-btn" onclick="changeQty('doraji',-1)">−</button>
        <span class="qty-num" id="num-doraji">1</span>
        <button class="qty-btn" onclick="changeQty('doraji',1)">+</button>
      </div>
    </div>

  </div>

  <!-- 주문자 정보 -->
  <div class="section">
    <div class="section-title"><span class="dot"></span>주문자 정보</div>
    <div class="form-row">
      <div class="form-label">성함</div>
      <input class="form-input" type="text" id="input-name" placeholder="이름을 입력해 주세요">
    </div>
    <div class="form-row">
      <div class="form-label">연락처</div>
      <input class="form-input" type="tel" id="input-phone" placeholder="010-0000-0000">
    </div>
  </div>

  <!-- 픽업 날짜 -->
  <div class="section">
    <div class="section-title"><span class="dot"></span>픽업 날짜</div>
    <div class="form-row">
      <div class="date-grid">
        <label class="date-opt" id="date-14" onclick="selectDate('14')">
          <input type="radio" name="date">
          <span>5월 14일 (수)</span>
        </label>
        <label class="date-opt" id="date-15" onclick="selectDate('15')">
          <input type="radio" name="date">
          <span>5월 15일 (목)</span>
        </label>
        <label class="date-opt" id="date-16" onclick="selectDate('16')" style="grid-column: span 2;">
          <input type="radio" name="date">
          <span>5월 16일 (금)</span>
        </label>
      </div>
    </div>
  </div>

  <!-- 픽업 시간 -->
  <div class="section">
    <div class="section-title"><span class="dot"></span>픽업 시간</div>
    <div class="form-row">
      <div class="time-grid" id="time-grid"></div>
    </div>
  </div>

  <!-- 최종 금액 -->
  <div class="total-box">
    <div class="total-label">최종 주문 금액</div>
    <div class="total-amount" id="total-display">0 <span>원</span></div>
  </div>

  <!-- 카카오 채널 버튼 -->
  <a class="kakao-btn" id="kakao-btn" href="#" onclick="goKakao(event)">
    <svg class="kakao-icon" viewBox="0 0 24 24" fill="none">
      <path d="M12 3C7.03 3 3 6.36 3 10.5c0 2.62 1.62 4.93 4.07 6.27L6 21l4.38-2.88C10.9 18.36 11.44 18.4 12 18.4c4.97 0 9-3.36 9-7.5S16.97 3 12 3z" fill="#3A1D1D"/>
    </svg>
    카카오 채널로 주문 상담하기
  </a>

  <div class="notice">
    버튼을 누르면 카카오 채널 채팅창이 열립니다.<br>
    자동으로 복사된 주문 내용을 붙여넣기(길게 누르기) 후 전송해 주세요 😊
  </div>

</div>

<script>
const prices = {
  'carn-4': 23000, 'carn-6': 33000,
  monaka: 33000, wagashi: 36500, doraji: 95000
};

const qty = {
  'carn-4': 1, 'carn-6': 1,
  monaka: 1, wagashi: 1, doraji: 1
};

const selected = {
  'carn-4': false, 'carn-6': false,
  monaka: false, wagashi: false, doraji: false
};

let selectedDate = '';
let selectedTime = '';

const times = [];
for (let h = 10; h <= 15; h++) {
  times.push(`${h}:00`);
  times.push(`${h}:30`);
}
times.push('16:00');

const tg = document.getElementById('time-grid');
times.forEach(t => {
  const el = document.createElement('label');
  el.className = 'time-opt';
  el.id = 'time-' + t.replace(':','');
  el.innerHTML = `<input type="radio" name="time"> ${t}`;
  el.onclick = () => selectTime(t, el);
  tg.appendChild(el);
});

function toggleSimple(key, checked) {
  selected[key] = checked;
  document.getElementById('qty-'+key).classList.toggle('active', checked);
  updateTotal();
}

function toggleSubOpts(key, checked) {
  document.getElementById('sub-'+key).classList.toggle('show', checked);
  if (!checked) {
    ['carn-4','carn-6'].forEach(k => {
      selected[k] = false;
      document.getElementById('sub-carn-' + (k==='carn-4'?'4':'6')).classList.remove('selected');
      document.getElementById('qty-carn-' + (k==='carn-4'?'4':'6')).classList.remove('active');
    });
  }
  updateTotal();
}

function toggleSubOpt(group, label, price, el) {
  event.preventDefault();
  const key = group + '-' + (label==='4구'?'4':'6');
  selected[key] = !selected[key];
  el.classList.toggle('selected', selected[key]);
  document.getElementById('qty-'+key).classList.toggle('active', selected[key]);
  updateTotal();
}

function changeQty(key, delta) {
  qty[key] = Math.max(1, (qty[key]||1) + delta);
  document.getElementById('num-'+key).textContent = qty[key];
  updateTotal();
}

function selectDate(d) {
  selectedDate = d;
  ['14','15','16'].forEach(x => {
    document.getElementById('date-'+x).classList.toggle('selected', x===d);
  });
}

function selectTime(t, el) {
  selectedTime = t;
  document.querySelectorAll('.time-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function updateTotal() {
  let total = 0;
  Object.keys(selected).forEach(k => {
    if (selected[k]) total += prices[k] * (qty[k]||1);
  });
  document.getElementById('total-display').innerHTML = total.toLocaleString() + ' <span>원</span>';
  return total;
}

function buildOrderText() {
  const name = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  
  const items = [];
  const nameMap = {
    'carn-4':'카네이션설기 4구', 'carn-6':'카네이션설기 6구',
    monaka:'복숭아모나카 set', wagashi:'화과자 set', doraji:'도라지정과 set'
  };
  const priceMap = {
    'carn-4':'23,000원','carn-6':'33,000원',
    monaka:'33,000원',wagashi:'36,500원',doraji:'95,000원'
  };

  Object.keys(selected).forEach(k => {
    if (selected[k]) {
      items.push(`  - ${nameMap[k]} × ${qty[k]||1}개 (${priceMap[k]})`);
    }
  });

  if (!name || !phone || items.length === 0 || !selectedDate || !selectedTime) return null;

  const dateStr = `5월 ${selectedDate}일`;

  let total = 0;
  Object.keys(selected).forEach(k => {
    if (selected[k]) total += prices[k] * (qty[k]||1);
  });

  return `📋 스승의 날 주문 상담\n\n👤 성함: ${name}\n📞 연락처: ${phone}\n\n🛍️ 주문 내역:\n${items.join('\n')}\n\n📅 픽업 날짜: ${dateStr}\n⏰ 픽업 시간: ${selectedTime}\n\n💰 최종 금액: ${total.toLocaleString()}원`;
}

function goKakao(e) {
  e.preventDefault();
  const text = buildOrderText();

  if (!text) {
    alert('주문자 성함, 연락처, 메뉴, 날짜, 시간을 모두 입력해 주세요 😊');
    return;
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        window.open('http://pf.kakao.com/_HBzyu/chat', '_blank');
      }).catch(() => {
        fallbackCopy(text);
        window.open('http://pf.kakao.com/_HBzyu/chat', '_blank');
      });
    } else {
      fallbackCopy(text);
      window.open('http://pf.kakao.com/_HBzyu/chat', '_blank');
    }
  } catch(err) {
    window.open('http://pf.kakao.com/_HBzyu/chat', '_blank');
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}
</script>
